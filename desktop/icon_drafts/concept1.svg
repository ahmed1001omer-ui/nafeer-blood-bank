<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="1024" height="1024">
  <defs>
    <linearGradient id="dropGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF334B" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>
    <linearGradient id="screenGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141E33" />
      <stop offset="100%" stop-color="#0B1120" />
    </linearGradient>
    <linearGradient id="frameGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>

  <!-- Monitor Stand Base -->
  <path d="M 160 416 L 352 416 C 362 416 370 422 370 430 C 370 438 362 444 352 444 L 160 444 C 150 444 142 438 142 430 C 142 422 150 416 160 416 Z" fill="#0F172A" />
