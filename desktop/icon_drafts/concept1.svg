  <path d="M 226 348 L 286 348 L 298 424 L 214 424 Z" fill="#1E293B" />
  
  <!-- Monitor Outer Frame (Deep Navy) -->
  <rect x="44" y="56" width="424" height="298" rx="28" ry="28" fill="url(#frameGrad1)" />
  
  <!-- Screen Area -->
  <rect x="62" y="74" width="388" height="248" rx="16" ry="16" fill="url(#screenGrad1)" />

  <!-- Top Window Header Line / Dots -->
  <circle cx="90" cy="94" r="5" fill="#38BDF8" opacity="0.8" />
  <circle cx="106" cy="94" r="5" fill="#64748B" opacity="0.6" />
  <circle cx="122" cy="94" r="5" fill="#64748B" opacity="0.6" />
  <line x1="80" y1="110" x2="432" y2="110" stroke="#1E293B" stroke-width="2" />

  <!-- Management Analytics Bars (Left side) -->
  <rect x="96" y="210" width="24" height="72" rx="6" fill="#38BDF8" />
  <rect x="132" y="174" width="24" height="108" rx="6" fill="#0284C7" />
  <rect x="168" y="142" width="24" height="140" rx="6" fill="#3B82F6" />
  
  <!-- Trend Analytics Line -->
  <path d="M 96 200 L 140 162 L 180 130 L 220 165" fill="none" stroke="#F8FAFC" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="220" cy="165" r="5.5" fill="#38BDF8" stroke="#FFFFFF" stroke-width="2" />

  <!-- Divider Line -->
  <line x1="244" y1="130" x2="244" y2="288" stroke="#1E293B" stroke-width="3" stroke-linecap="round" />

  <!-- Blood Droplet (Right side) -->
  <!-- Drop Path: tip at (342, 134), belly down to (342, 286) -->
  <path d="M 342 134 C 342 134 286 210 286 248 C 286 280 311 300 342 300 C 373 300 398 280 398 248 C 398 210 342 134 342 134 Z" fill="url(#dropGrad1)" />

  <!-- Vital Pulse Line across Blood Droplet -->
