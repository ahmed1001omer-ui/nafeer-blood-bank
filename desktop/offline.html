<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>تعذر الاتصال بالخادم - نظام نفير</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #1e293b;
      padding: 40px;
      border-radius: 16px;
      text-align: center;
      max-width: 480px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      border: 1px solid #334155;
    }
    h2 { color: #ef4444; margin-top: 0; }
    p { color: #94a3b8; font-size: 14px; line-height: 1.6; }
    button {
      background: #dc2626;
      color: white;
      border: none;
      padding: 12px 28px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 20px;
    }
    button:hover { background: #b91c1c; }
  </style>
</head>
<body>
  <div class="card">
    <h2>تعذر الاتصال بالخادم</h2>
    <p>يرجى التأكد من اتصال الحاسوب بالإنترنت، أو تشغيل الخادم المحلي على المنفذ 3000.</p>
    <button onclick="window.location.reload()">إعادة المحاولة الآن</button>
  </div>
</body>
</html>
